services:
  edgeever:
    image: "${EDGE_EVER_IMAGE:-ghcr.io/scupro/edgeever}:${EDGE_EVER_VERSION:-latest}"
    restart: unless-stopped
    init: true
    ports:
      - "${EDGE_EVER_PORT:-8787}:8787"
    environment:
      AUTH_USER: "${AUTH_USER:-admin}"
      AUTH_PASSWORD: "${AUTH_PASSWORD:?Set AUTH_PASSWORD before starting EdgeEver}"
      EDGE_EVER_CONTAINER_IMAGE: "${EDGE_EVER_IMAGE:-ghcr.io/scupro/edgeever}"
    volumes:
      - edgeever-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  edgeever-data:
