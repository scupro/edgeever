name = "edgeever"
main = ".wrangler/edgeever-worker/index.js"
compatibility_date = "2026-06-26"
workers_dev = true
no_bundle = true
find_additional_modules = true
base_dir = ".wrangler/edgeever-worker"

[[rules]]
type = "ESModule"
globs = ["modules/*.js"]
fallthrough = true

[build]
command = "bun scripts/build-cloudflare-worker.mjs"
watch_dir = ["apps/api/src", "packages/shared/src"]

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/mcp", "/__scheduled", "/share/notebook/*", "/s/*"]

[[d1_databases]]
binding = "DB"
database_name = "edgeever"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"

# 實例專屬的非敏感環境變數可直接寫在這裡，部署流程會與 EDGE_EVER_* 設定合併。
# Instance-specific non-secret environment variables may be added here.
# [vars]
# AUTH_USER = "admin"
